name: 21 Pre Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor

          TOPIC = os.environ["NTFY_TOPIC"].strip()
          MANUAL = os.environ.get("EVENT") == "workflow_dispatch"
          PCT, MIN_VOL = 10.0, 1_000_000
          WINDOW, COOLDOWN = 16 * 60, 15 * 60
          RUN_SECONDS, POLL = 28 * 60, 60
          BASE = "https://fapi.binance.com"

          def get(path):
              req = urllib.request.Request(BASE + path, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def push(title, message, priority=4, click=None):
              body = {"topic": TOPIC, "title": title, "message": message, "priority": priority}
              if click:
                  body["click"] = click
              req = urllib.request.Request("https://ntfy.sh/", data=json.dumps(body).encode("utf-8"),
                                           headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except Exception as e:
                  print("ntfy error:", e)

          def fmt(p):
              if p >= 1000: return f"{p:,.2f}"
              if p >= 1: return f"{p:.4f}"
              if p >= 0.01: return f"{p:.5f}"
              return f"{p:.8f}"

          def load_symbols():
              info = get("/fapi/v1/exchangeInfo")
              perp = {s["symbol"] for s in info["symbols"]
                      if s["contractType"] == "PERPETUAL" and s["status"] == "TRADING" and s["quoteAsset"] == "USDT"}
              vol = {t["symbol"]: float(t["quoteVolume"]) for t in get("/fapi/v1/ticker/24hr")}
              return {s: vol[s] for s in perp if vol.get(s, 0) >= MIN_VOL}

          try:
              syms = load_symbols()
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              if MANUAL:
                  push("Binance erişim hatası", f"HTTP {e.code}: GitHub sunucusundan Binance vadeli API'sine erişilemiyor.", 3)
              sys.exit(1)
          except Exception as e:
              print("ERR", e)
              if MANUAL:
                  push("Bağlantı hatası", str(e)[:200], 3)
              sys.exit(1)

          hist, last = {}, {}

          def bootstrap():
              def one(s):
                  try:
                      k = get(f"/fapi/v1/klines?symbol={s}&interval=1m&limit=16")
                      return s, [(c[0] / 1000, float(c[1])) for c in k]
                  except Exception:
                      return s, []
              with ThreadPoolExecutor(12) as ex:
                  for s, pts in ex.map(one, list(syms)):
                      hist[s] = pts

          bootstrap()
          if MANUAL:
              push("Test başarılı", f"{len(syms)} coin izleniyor (hacim ≥ $1M). Son 15 dk'da %{PCT:.0f}+ harekette bildirim gelecek.", 3)

          def poll():
              prices = {x["symbol"]: float(x["price"]) for x in get("/fapi/v1/ticker/price")}
              now = time.time()
              hits = []
              for s in syms:
                  p = prices.get(s)
                  if p is None:
                      continue
                  h = hist.setdefault(s, [])
                  h.append((now, p))
                  while h and now - h[0][0] > WINDOW:
                      h.pop(0)
                  if len(h) < 2:
                      continue
                  t0, base = h[0]
                  pct = (p - base) / base * 100
                  if abs(pct) >= PCT and now - last.get(s, 0) > COOLDOWN:
                      last[s] = now
                      hits.append((s, pct, base, p, max(1, round((now - t0) / 60))))
              hits.sort(key=lambda x: -abs(x[1]))
              if len(hits) > 5:
                  push(f"{len(hits)} coin %{PCT:.0f}+ hareket etti",
                       " · ".join(f"{s[:-4]} {pct:+.1f}%" for s, pct, *_ in hits))
              else:
                  for s, pct, base, p, mins in hits:
                      push(f"{'▲' if pct >= 0 else '▼'} {s[:-4]} {pct:+.2f}% ({mins} dk)",
                           f"${fmt(base)} → ${fmt(p)} · 24s hacim {syms[s]/1e6:.0f}M",
                           click=f"https://www.binance.com/en/futures/{s}")

          end = time.time() + RUN_SECONDS
          next_refresh = time.time() + 600
          while True:
              t = time.time()
              try:
                  poll()
                  if t > next_refresh:
                      syms = load_symbols()
                      next_refresh = t + 600
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code)
                  if e.code in (418, 429):
                      time.sleep(30)
              except Exception as e:
                  print("ERR", e)
              if time.time() > end:
                  break
              time.sleep(max(1, POLL - (time.time() - t)))
          PY
